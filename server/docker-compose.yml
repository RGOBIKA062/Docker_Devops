services:
  mongodb:
    image: mongo:7
    container_name: allcollegeevents-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: allcollegeevents-server
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongodb:27017/allcollegeevents
      FRONTEND_URL: http://localhost:8080
      CORS_ORIGIN: http://localhost:8080
      JWT_SECRET: ${JWT_SECRET:-change-this-jwt-secret-min-32-chars}
      GROQ_API_KEY: ${GROQ_API_KEY:-dummy-dev-key}
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health > /dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  client:
    build:
      context: ../client
      dockerfile: Dockerfile
    container_name: allcollegeevents-client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_started
    ports:
      - "8080:80"

volumes:
  mongo_data:
